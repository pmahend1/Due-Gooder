# Schools DueGooder collects. Everything school-specific lives here, never in code.
#
#   id        stable slug; root of every natural key (school + term + course + section)
#   timezone  IANA zone; meeting times are stored as wall-clock times in this zone
#   homepage  where discovery starts: each run identifies the platform and its entry point from this page alone
#   platform  + base_url: set both only to skip discovery, when the entry point can't be found from the
#             homepage (each such entry says why); a run's report lists which schools needed it
#   mep_code  Banner multi-institution code, for servers that host several campuses
#
# The Banner 9 schools below were confirmed on 2026-09-11 (classSearch/getTerms returned term JSON) when
# their base_url was found by hand; since S6 discovery finds it again on every run.

schools:
  - id: eku
    name: Eastern Kentucky University
    homepage: https://www.eku.edu/
    timezone: America/New_York
    # Its Banner host's robots.txt disallows every crawler (checked in S4), so it is never collected. Kept
    # (decided in S6) so every run records that refusal in the review queue; S3's live run and the fixtures
    # predate the check. Remove these lines to drop it from the list.

  - id: uiuc
    name: University of Illinois Urbana-Champaign
    homepage: https://illinois.edu/
    timezone: America/Chicago
    platform: banner9
    base_url: https://banner.apps.uillinois.edu/StudentRegistrationSSB/
    mep_code: 1UIUC
    # getTerms is public, but term/search redirects to a SAML sign-in (checked 2026-09-11), so
    # collection is expected to fail with a recorded reason. Kept as the failure-handling example.

