# Schools DueGooder collects. Everything school-specific lives here, never in code.
#
#   id        stable slug; root of every natural key (school + term + course + section)
#   timezone  IANA zone; meeting times are stored as wall-clock times in this zone
#   platform  suspected platform; identification (T12) confirms or corrects it
#   base_url  platform entry point, when already known
#   mep_code  Banner multi-institution code, for servers that host several campuses
#
# Every Banner 9 host below was confirmed on 2026-09-11: classSearch/getTerms returned term JSON.

schools:
  - id: eku
    name: Eastern Kentucky University
    homepage: https://www.eku.edu/
    timezone: America/New_York
    platform: banner9
    base_url: https://registrationss.eku.edu/StudentRegistrationSsb/

